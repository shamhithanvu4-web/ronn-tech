# In-scope tokens per chain, identified by CONTRACT ADDRESS (never by symbol:
# fake "USDT" tokens are used in address-poisoning scams).
#
# verified: true  -> the contract was checked on the chain's official explorer or
#                    the issuer's own contract list, at verified_url, on verified_at.
# verified: false -> could not be checked from the build environment; the team
#                    must open verify_url and confirm before relying on it.
# contract: null  -> no issuer-listed contract was found; the token is not tracked.
#
# EVM contracts are stored lowercase (labels and transfers are lowercased too).

